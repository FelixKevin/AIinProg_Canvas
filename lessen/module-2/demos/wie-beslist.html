<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Demo: wie beslist?</title>
<link rel="stylesheet" href="../../shared/demo.css">
<style>
  .grid { grid-template-columns: 0.72fr 1.1fr 1.05fr; }
  .pieces { display: grid; gap: 9px; }
  .pieces button { text-align: left; padding: 11px 16px; display: flex; align-items: center; gap: 12px; font-size: 21px; }
  .pieces button i { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 18px; flex: none; color: transparent; }
  .pieces button.on i { background: var(--green); border-color: var(--green); color: #0B0B10; }
  #prompt { flex: 1; min-height: 0; overflow: auto; font: 500 20px/1.45 var(--mono); white-space: pre-wrap; background: #0D0D13; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  #prompt .base { color: var(--text); }
  #prompt .add { color: var(--green); }
  #prompt .add.new { background: rgba(134, 239, 172, .14); border-radius: 6px; }
  .who { display: grid; gap: 4px; overflow: auto; flex: 1; min-height: 0; align-content: start; }
  .who .r { display: grid; grid-template-columns: 1fr 132px; gap: 12px; align-items: center; padding: 3px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
  .who .r b { font-weight: 600; font-size: 20px; display: block; line-height: 1.25; }
  .who .r small { font: 500 14px var(--mono); color: var(--muted); display: block; margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .tag { font: 700 17px var(--mono); text-align: center; padding: 6px 0; border-radius: 9px; }
  .who .r.model .tag { background: rgba(252, 165, 165, .16); color: var(--red); border: 1px solid rgba(252, 165, 165, .5); }
  .who .r.you .tag { background: rgba(134, 239, 172, .16); color: var(--green); border: 1px solid rgba(134, 239, 172, .5); }
  .who .r.you small { visibility: hidden; }
  .meter { height: 18px; border-radius: 9px; background: rgba(252, 165, 165, .25); overflow: hidden; margin: 2px 0 10px; }
  .meter i { display: block; height: 100%; background: var(--green); border-radius: 11px; transition: width .35s ease; }
  .score { font-family: var(--display); font-size: 30px; font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <h1>Wie beslist: jij of het model?</h1>
    <span class="pill">klik een onderdeel aan en kijk wat er verandert</span>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Voeg toe aan je prompt</h2>
      <div class="pieces" id="pieces"></div>
      <div class="row" style="margin-top:auto; padding-top:14px; gap:10px">
        <button id="all">Alles aan</button>
        <button class="ghost" id="reset">Reset</button>
      </div>
    </div>

    <div class="panel">
      <h2>Je prompt · <span id="words" style="letter-spacing:0; text-transform:none"></span></h2>
      <div id="prompt"></div>
    </div>

    <div class="panel">
      <div class="score" id="score"></div>
      <div class="meter"><i id="bar"></i></div>
      <div class="who" id="who"></div>
    </div>
  </div>

<script src="../../shared/demo.js"></script>
<script>
const BASE = 'Maak een function die een prijs berekent.';
const PIECES = [
  { id: 'context', label: 'Context', text: 'Context: een JavaScript-project met Node.js, zonder framework. De function komt in het bestand src/prijzen.js.' },
  { id: 'input', label: 'Input', text: 'Input: de function heet berekenPrijs(prijsInCent, kortingPercent). Beide zijn gehele getallen.' },
  { id: 'output', label: 'Output', text: 'Output: de prijs na korting in eurocent, als geheel getal.' },
  { id: 'regel', label: 'De regel', text: 'De korting is een percentage van 0 tot 100.' },
  { id: 'afronding', label: 'Afronding', text: 'Rond het resultaat af naar beneden.' },
  { id: 'fouten', label: 'Foute input', text: "Is de korting kleiner dan 0 of groter dan 100, gooi dan een Error met de boodschap 'Ongeldige korting'." },
  { id: 'beperkingen', label: 'Beperkingen', text: 'Beperkingen: gebruik geen externe libraries. Schrijf alleen deze function: geen tests en geen voorbeeldcode.' },
  { id: 'voorbeelden', label: 'Voorbeelden', text: 'Voorbeelden:\nberekenPrijs(2000, 10) -> 1800\nberekenPrijs(999, 15) -> 849\nberekenPrijs(2000, 0) -> 2000' },
];
const DECISIONS = [
  { by: 'context', what: 'De programmeertaal', guess: 'Python? JavaScript? Java?' },
  { by: 'context', what: 'In welk bestand de code komt', guess: 'een nieuw bestand? welke map?' },
  { by: 'input', what: 'De naam van de function', guess: 'calculatePrice? getPrice? prijs?' },
  { by: 'input', what: 'Wat de function krijgt', guess: 'een prijs? een lijst? een object?' },
  { by: 'output', what: 'Wat ze teruggeeft', guess: 'euro? cent? een tekst met €?' },
  { by: 'regel', what: 'Hoe de prijs berekend wordt', guess: 'btw? korting? aantal?' },
  { by: 'afronding', what: 'Hoe het bedrag afgerond wordt', guess: 'omhoog? omlaag? niet?' },
  { by: 'fouten', what: 'Wat er gebeurt bij foute input', guess: 'crash? 0? een foutmelding?' },
  { by: 'beperkingen', what: 'Of er libraries gebruikt worden', guess: 'misschien wel, misschien niet' },
  { by: 'beperkingen', what: 'Wat er nog bij komt', guess: 'tests? uitleg? extra functions?' },
  { by: 'voorbeelden', what: 'Welke uitkomst juist is', guess: 'dat weet alleen jij' },
];
const $ = (id) => document.getElementById(id);
const on = new Set();
let last = null;

function render() {
  $('pieces').innerHTML = PIECES.map((p) => `<button data-id="${p.id}" class="${on.has(p.id) ? 'on' : ''}"><i>✓</i>${p.label}</button>`).join('');
  const added = PIECES.filter((p) => on.has(p.id));
  $('prompt').innerHTML = `<span class="base">${BASE}</span>` + added.map((p) => `\n<span class="add${p.id === last ? ' new' : ''}">${p.text.replace(/</g, '&lt;')}</span>`).join('');
  const text = [BASE, ...added.map((p) => p.text)].join(' ');
  $('words').textContent = `${text.split(/\s+/).length} woorden`;
  const mine = DECISIONS.filter((d) => on.has(d.by)).length;
  $('score').innerHTML = `Jij beslist <span class="${mine === DECISIONS.length ? 'good' : mine ? 'warn' : 'bad'}">${mine} van ${DECISIONS.length}</span>`;
  $('bar').style.width = `${(mine / DECISIONS.length) * 100}%`;
  $('who').innerHTML = DECISIONS.map((d) => {
    const you = on.has(d.by);
    return `<div class="r ${you ? 'you' : 'model'}"><div><b>${d.what}</b><small>${d.guess}</small></div><span class="tag">${you ? 'jij' : 'het model'}</span></div>`;
  }).join('');
}
$('pieces').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.id;
  if (on.has(id)) { on.delete(id); last = null; } else { on.add(id); last = id; }
  render();
});
$('all').addEventListener('click', () => { PIECES.forEach((p) => on.add(p.id)); last = null; render(); });
$('reset').addEventListener('click', () => { on.clear(); last = null; render(); });
render();
</script>
</body>
</html>
